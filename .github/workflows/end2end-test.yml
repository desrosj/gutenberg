name: End-to-End Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/[0-9]+.[0-9]'
            - 'wp/[0-9]+.[0-9]'
            - wp/latest
            - wp/next

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    e2e-puppeteer:
        name: Puppeteer
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 45

        steps:
            - name: Create a dummy debug artifact
              run: mkdir -p artifacts && echo "${{ github.job }} ${{ strategy.job-index }}" > artifacts/dummy-${{ github.job }}-${{ strategy.job-index }}.txt

            - name: Archive debug artifacts (screenshots, HTML snapshots)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: failures-artifacts--puppeteer
                  path: artifacts
                  if-no-files-found: ignore
                  retention-days: 14

    e2e-playwright:
        name: Playwright - ${{ matrix.part }}
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                part: [1, 2, 3, 4, 5, 6, 7, 8]
                totalParts: [8]

        steps:
            - name: Create a dummy debug artifact
              run: mkdir -p artifacts/test-results && echo "${{ github.job }} ${{ strategy.job-index }}" > artifacts/test-results/dummy-${{ github.job }}-${{ strategy.job-index }}.txt

            - name: Archive debug artifacts (screenshots, traces)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: failures-artifacts--playwright-${{ matrix.part }}
                  path: artifacts/test-results
                  if-no-files-found: ignore
                  retention-days: 14

    merge-artifacts:
        name: Merge Artifacts
        if: ${{ !cancelled() }}
        needs: [e2e-puppeteer, e2e-playwright]
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 5
        steps:
            - name: Merge failures artifacts
              uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              # Don't fail the job if there aren't any artifacts to merge.
              continue-on-error: true
              with:
                  name: failures-artifacts
                  # Retain the merged artifacts in case of a rerun.
                  pattern: failures-artifacts*
                  delete-merged: true
                  retention-days: 14
