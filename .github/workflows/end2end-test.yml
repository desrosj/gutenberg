name: End-to-End Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/[0-9]+.[0-9]'
            - 'wp/[0-9]+.[0-9]'
            - wp/latest
            - wp/next

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    admin:
        name: Admin (${{ matrix.variant }} ${{ matrix.shard }})
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        timeout-minutes: 120
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                variant: [ 'baseline', 'fixed' ]
                shard: [ 1, 2 ]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            # DIAGNOSTIC: use the unfixed spec for the baseline variant.
            - name: Restore the unfixed spec
              if: ${{ matrix.variant == 'baseline' }}
              run: cp .github/diag/block-grouping.baseline.js packages/e2e-tests/specs/editor/various/block-grouping.test.js

            - name: Build
              env:
                  FORCE_REDUCED_MOTION: true
              run: npm run build

            - name: Install WordPress
              uses: ./.github/setup-wordpress

            # WordPress turns on pretty permalinks during the install, because this environment supports
            # them. The tests' request mocks only match the `?rest_route=` REST API URLs that plain
            # permalinks produce, which is what the tests were written against.
            - name: Use plain permalinks
              run: npm run env cli option delete permalink_structure

            # DIAGNOSTIC: run the block grouping spec 30 times.
            - name: Run the block grouping spec repeatedly
              env:
                  VARIANT: ${{ matrix.variant }}
              run: |
                  runs=0
                  completed=0
                  failed=0
                  other=0
                  for i in $(seq 1 30); do
                      runs=$((runs + 1))
                      ./node_modules/.bin/wp-scripts test-e2e --config=packages/e2e-tests/jest.config.js --cacheDirectory="${RUNNER_TEMP}/jest-cache-$i" --runTestsByPath packages/e2e-tests/specs/editor/various/block-grouping.test.js > "${RUNNER_TEMP}/run-$i.log" 2>&1 || true
                      grep -E '^(PASS|FAIL) |^Tests:' "${RUNNER_TEMP}/run-$i.log" || true
                      if grep -q '^Tests:' "${RUNNER_TEMP}/run-$i.log"; then
                          completed=$((completed + 1))
                      fi
                      if grep -q '● Block Grouping › Preserving selected blocks attributes › preserves width alignment settings of selected blocks' "${RUNNER_TEMP}/run-$i.log"; then
                          failed=$((failed + 1))
                          echo "::warning::Run $i: preserves width alignment failed"
                          grep -A12 '● Block Grouping › Preserving selected blocks attributes › preserves width alignment settings of selected blocks' "${RUNNER_TEMP}/run-$i.log" | head -14
                      elif grep -q '^FAIL ' "${RUNNER_TEMP}/run-$i.log"; then
                          other=$((other + 1))
                          grep -A20 '●' "${RUNNER_TEMP}/run-$i.log" | head -40
                      fi
                  done
                  echo "$VARIANT: preserves width alignment failed in $failed of $runs runs ($completed completed, $other with other failures only)" | tee -a "$GITHUB_STEP_SUMMARY"
