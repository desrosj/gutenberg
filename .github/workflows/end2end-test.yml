name: End-to-End Tests

on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

permissions: {}

jobs:
    admin:
        name: Admin (${{ matrix.variant }})
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        timeout-minutes: 85
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                variant: [ 'spec', 'pair', 'suite-a', 'suite-b' ]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Install WordPress
              uses: ./.github/setup-wordpress

            - name: Reset the end-to-end test site
              run: ./bin/reset-e2e-tests.sh

            # DIAGNOSTIC: use the instrumented writing flow spec.
            - name: Use the instrumented writing flow spec
              run: cp .github/diag/writing-flow.instrumented.js test/e2e/specs/writing-flow.test.js

            # DIAGNOSTIC: run the variant repeatedly within a time budget.
            - name: Run the tests repeatedly
              env:
                  VARIANT: ${{ matrix.variant }}
              run: |
                  export DIAG_TRACE="${RUNNER_TEMP}/trace.jsonl"
                  case "$VARIANT" in
                      spec) runs=40; files='test/e2e/specs/writing-flow.test.js' ;;
                      pair) runs=30; files='test/e2e/specs/links.test.js test/e2e/specs/writing-flow.test.js' ;;
                      *) runs=12; files='' ;;
                  esac
                  start=$(date +%s)
                  for i in $(seq 1 "$runs"); do
                      if [ $(( $(date +%s) - start )) -gt 3000 ]; then
                          echo "::notice::Time budget reached after $((i - 1)) runs"
                          break
                      fi
                      export DIAG_RUN="$i"
                      # shellcheck disable=SC2086
                      ./node_modules/.bin/wp-scripts test-e2e --config=test/e2e/jest.config.json --ci --cacheDirectory="${RUNNER_TEMP}/jest-cache-$i" $files > "${RUNNER_TEMP}/run-$i.log" 2>&1 || true
                      grep -E '^(PASS|FAIL) ' "${RUNNER_TEMP}/run-$i.log" | head -3 || true
                      grep -A30 '●' "${RUNNER_TEMP}/run-$i.log" | head -120 || true
                  done

            - name: Summarize the traces
              if: ${{ always() }}
              env:
                  VARIANT: ${{ matrix.variant }}
              run: python3 .github/diag/summarize.py "${RUNNER_TEMP}/trace.jsonl" "$VARIANT" | tee -a summary.txt; head -1 summary.txt >> "$GITHUB_STEP_SUMMARY"
