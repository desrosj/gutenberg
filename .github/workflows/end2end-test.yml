name: End-to-End Tests

on:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

permissions: {}

jobs:
    admin:
        name: Admin (${{ matrix.variant }})
        runs-on: 'ubuntu-24.04'
        permissions:
            contents: read
        timeout-minutes: 85
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                variant: [ 'baseline', 'fixed' ]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Install WordPress
              uses: ./.github/setup-wordpress

            - name: Reset the end-to-end test site
              run: ./bin/reset-e2e-tests.sh

            # DIAGNOSTIC: swap in the fixed writing flow spec.
            - name: Use the fixed writing flow spec
              if: ${{ matrix.variant == 'fixed' }}
              run: cp .github/diag/writing-flow.fixed.js test/e2e/specs/writing-flow.test.js

            # DIAGNOSTIC: run the links and writing flow specs together 30 times.
            - name: Run the links and writing flow specs repeatedly
              env:
                  VARIANT: ${{ matrix.variant }}
              run: |
                  runs=0
                  completed=0
                  failed=0
                  other=0
                  for i in $(seq 1 30); do
                      runs=$((runs + 1))
                      ./node_modules/.bin/wp-scripts test-e2e --config=test/e2e/jest.config.json --ci --cacheDirectory="${RUNNER_TEMP}/jest-cache-$i" test/e2e/specs/links.test.js test/e2e/specs/writing-flow.test.js > "${RUNNER_TEMP}/run-$i.log" 2>&1 || true
                      grep -E '^(PASS|FAIL) |^Tests:' "${RUNNER_TEMP}/run-$i.log" || true
                      if grep -q '^Tests:' "${RUNNER_TEMP}/run-$i.log"; then
                          completed=$((completed + 1))
                      fi
                      if grep -q '● adding blocks › should clean TinyMCE content' "${RUNNER_TEMP}/run-$i.log"; then
                          failed=$((failed + 1))
                          echo "::warning::Run $i: should clean TinyMCE content failed"
                          grep -A30 '● adding blocks › should clean TinyMCE content' "${RUNNER_TEMP}/run-$i.log" | head -40
                      elif grep -q '^FAIL ' "${RUNNER_TEMP}/run-$i.log"; then
                          other=$((other + 1))
                          grep -A20 '●' "${RUNNER_TEMP}/run-$i.log" | head -40
                      fi
                  done
                  echo "$VARIANT: should clean TinyMCE content failed in $failed of $runs runs ($completed completed, $other with other failures only)" | tee -a "$GITHUB_STEP_SUMMARY"
