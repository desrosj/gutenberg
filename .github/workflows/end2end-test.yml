name: End-to-End Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/[0-9]+.[0-9]'
            - 'wp/[0-9]+.[0-9]'
            - wp/latest
            - wp/next

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Runs WordPress on PHP 8.1, the highest version WordPress 6.0 supports, instead of
# whatever version the floating `wordpress` image uses.
env:
    WP_ENV_PHP_VERSION: '8.1'

jobs:
    admin:
        name: Admin (${{ matrix.variant }} ${{ matrix.shard }})
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 120
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                variant: [ 'baseline', 'fixed' ]
                shard: [ 1, 2 ]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use desired version of NodeJS
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            # DIAGNOSTIC: use the unfixed spec for the baseline variant.
            - name: Restore the unfixed spec
              if: ${{ matrix.variant == 'baseline' }}
              run: cp .github/diag/comments-query.baseline.js packages/e2e-tests/specs/experiments/blocks/comments-query.test.js

            - name: Npm install and build
              run: |
                  npm ci
                  npm run build

            - name: Install WordPress
              run: |
                  npm run wp-env start

            # DIAGNOSTIC: run the Comment Query Loop spec 30 times.
            - name: Run the Comment Query Loop spec repeatedly
              env:
                  VARIANT: ${{ matrix.variant }}
              run: |
                  runs=0
                  completed=0
                  failed=0
                  other=0
                  for i in $(seq 1 30); do
                      runs=$((runs + 1))
                      $( npm bin )/wp-scripts test-e2e --config=./packages/e2e-tests/jest.config.js --cacheDirectory="${RUNNER_TEMP}/jest-cache-$i" --runTestsByPath packages/e2e-tests/specs/experiments/blocks/comments-query.test.js > "${RUNNER_TEMP}/run-$i.log" 2>&1 || true
                      grep -E '^(PASS|FAIL) |^Tests:' "${RUNNER_TEMP}/run-$i.log" || true
                      if grep -q '^Tests:' "${RUNNER_TEMP}/run-$i.log"; then
                          completed=$((completed + 1))
                      fi
                      if grep -q '● Comment Query Loop › Pagination links are working as expected' "${RUNNER_TEMP}/run-$i.log"; then
                          failed=$((failed + 1))
                          echo "::warning::Run $i: pagination links test failed"
                          grep -A12 '● Comment Query Loop › Pagination links are working as expected' "${RUNNER_TEMP}/run-$i.log" | head -14
                      elif grep -q '^FAIL ' "${RUNNER_TEMP}/run-$i.log"; then
                          other=$((other + 1))
                          grep -A20 '●' "${RUNNER_TEMP}/run-$i.log" | head -40
                      fi
                  done
                  echo "$VARIANT: pagination links test failed in $failed of $runs runs ($completed completed, $other with other failures only)" | tee -a "$GITHUB_STEP_SUMMARY"

            - name: Archive debug artifacts (screenshots, HTML snapshots)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: failures-artifacts--${{ matrix.part }}
                  path: artifacts
                  if-no-files-found: ignore
                  retention-days: 14

    merge-artifacts:
        name: Merge Artifacts
        if: ${{ !cancelled() }}
        needs: [admin]
        runs-on: 'ubuntu-24.04'
        timeout-minutes: 5
        steps:
            - name: Merge failures artifacts
              uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              # Don't fail the job if there aren't any artifacts to merge.
              continue-on-error: true
              with:
                  name: failures-artifacts
                  # Retain the merged artifacts in case of a rerun.
                  pattern: failures-artifacts*
                  delete-merged: true
                  retention-days: 14
