name: End-to-End Tests

on:
  pull_request:
  push:
    branches:
    - trunk
    - 'release/[0-9]+.[0-9]'
    - 'wp/[0-9]+.[0-9]'
    - wp/latest
    - wp/next
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  admin:
    name: Admin

    runs-on: 'ubuntu-24.04'

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install
      run: npm ci

    - name: Install WordPress
      uses: ./.github/setup-wordpress

    - name: Running the tests
      # `npm run test-e2e` first runs `bin/reset-e2e-tests.sh`, which installs WordPress in the
      # container the tests run against, and `npm run build`.
      run: npm run test-e2e -- --ci --cacheDirectory="$HOME/.jest-cache"
