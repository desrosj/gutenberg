name: End-to-End Tests

on:
    pull_request:
    push:
        branches:
            - trunk
            - 'release/**'
            - 'wp/**'

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    e2e-puppeteer:
        name: Puppeteer - ${{ matrix.part }}
        runs-on: ubuntu-latest
        # SPIKE: disabled, this job is unrelated to the Playwright/Noble investigation
        # this branch exists for.
        if: false
        strategy:
            fail-fast: false
            matrix:
                part: [1, 2, 3]
                totalParts: [3]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Npm build
              run: npm run build

            - name: Install WordPress
              run: |
                  npm run wp-env start

            - name: Running the tests
              run: |
                  npx wp-scripts test-e2e --config=./packages/e2e-tests/jest.config.js --listTests > ~/.jest-e2e-tests
                  npx wp-scripts test-e2e --config=./packages/e2e-tests/jest.config.js --cacheDirectory="$HOME/.jest-cache" --runTestsByPath $( awk 'NR % ${{ matrix.totalParts }} == ${{ matrix.part }} - 1' < ~/.jest-e2e-tests )

            - name: Archive debug artifacts (screenshots, HTML snapshots)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: failures-artifacts
                  path: artifacts
                  if-no-files-found: ignore

            - name: Archive flaky tests report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: flaky-tests-report
                  path: flaky-tests
                  if-no-files-found: ignore

    e2e-playwright:
        name: Playwright - ${{ matrix.part }}
        runs-on: ubuntu-latest
        if: ${{ github.repository == 'WordPress/gutenberg' || github.event_name == 'pull_request' }}
        strategy:
            fail-fast: false
            matrix:
                # SPIKE: scoped down to a single shard while iterating on the
                # system-package list, to keep each CI round-trip short.
                part: [1]
                totalParts: [1]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Setup Node.js and install dependencies
              uses: ./.github/setup-node

            - name: Npm build
              run: npm run build

            # SPIKE: install browser binaries only, without Playwright's own
            # `--with-deps` OS-package installer, which doesn't recognize
            # Ubuntu 24.04 "Noble" (the current `ubuntu-latest`) on this old
            # Playwright version. System libraries are installed by hand in
            # the next step instead.
            - name: Install Playwright browser binaries (no --with-deps)
              run: |
                  npx playwright install chromium firefox webkit

            # SPIKE: diagnostic-only launch check for all three browsers in a
            # single step, so one CI run reports the missing-library error
            # for every browser at once instead of only the first one that
            # happens to run. Not part of the eventual real fix.
            - name: Diagnostic - attempt to launch each browser
              run: |
                  node -e "
                  const { chromium, firefox, webkit } = require('playwright-core');
                  (async () => {
                    for (const [name, type] of [['chromium', chromium], ['firefox', firefox], ['webkit', webkit]]) {
                      try {
                        const browser = await type.launch();
                        await browser.close();
                        console.log('=== ' + name + ': OK ===');
                      } catch (e) {
                        console.log('=== ' + name + ': FAILED ===');
                        console.log(e.message);
                      }
                    }
                  })();
                  "

            # SPIKE: wp-env + the real test run are re-enabled once the
            # diagnostic launch step above is passing, to keep early
            # dependency-hunting iterations fast.
            - name: Install WordPress and start the server
              if: false
              run: |
                  npm run wp-env start

            - name: Run the tests
              if: false
              run: |
                  xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run test:e2e:playwright -- --shard=${{ matrix.part }}/${{ matrix.totalParts }}

            - name: Archive debug artifacts (screenshots, traces)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: failures-artifacts
                  path: artifacts/test-results
                  if-no-files-found: ignore

            - name: Archive flaky tests report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: flaky-tests-report
                  path: flaky-tests
                  if-no-files-found: ignore
