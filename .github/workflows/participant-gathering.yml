name: Participant Gathering

on:
  # Gathers all of the participants for pull requests to assist in giving proper credit.
  pull_request:

jobs:
  pull_request_participants:
    name: Gather pull request participants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    #
    steps:
      - name: Fetch a list of contributors
        uses: actions/github-script@e3cbab99d3a9b271e1b79fc96d103a4a5534998c # v5.1.0
        continue-on-error: ${{ true }}
        with:
          script: |
            const contributorData = {};
            contributorData.userData = [];
            contributorData.committers = new Set();

            await github.paginate( github.rest.pulls.listCommits, {
              owner: 'WordPress',
              repo: 'gutenberg',
              pull_number: 38360,
            })
            .then((commits) => {
              for (const commit of commits) {
                let login = '';
                let author = {};

                if ( null != commit.author ) {
                  login = commit.author.login;
                  author = commit.author;
                } else {
                  login = commit.commit.author.name;
                  author = commit.commit.author;
                }

                contributorData.committers.add( login );
                contributorData.userData[login] = author;
              }
            });

            contributorData.commenters = new Set();

            await github.paginate( github.rest.issues.listComments, {
              owner: 'WordPress',
              repo: 'gutenberg',
              issue_number: 38362,
            })
            .then((comments) => {
              for (const comment of comments) {
                if (!contributorData.committers.has(comment.user.login)) {
                  contributorData.commenters.add(comment.user.login);
                  contributorData.userData[comment.user.login] = comment.user;
                }
              }
            });

            contributorData.reviewers = new Set();

            await github.paginate( github.rest.pulls.listReviews, {
              owner: 'WordPress',
              repo: 'gutenberg',
              pull_number: 38362,
            })
            .then((reviews) => {
              console.debug(reviews);
              for (const review of reviews) {
                if (!contributorData.committers.has(review.user.login) && !contributorData.commenters.has(review.user.login)) {
                  contributorData.reviewers.add(review.user.login);
                  contributorData.userData[review.user.login] = review.user;
                }
              }
            });

            console.debug( contributorData );

      - name: GraphQL
        uses: actions/github-script@e3cbab99d3a9b271e1b79fc96d103a4a5534998c # v5.1.0
        continue-on-error: ${{ true }}
        with:
          script: |
            const ownerName = 'WordPress';
            const repoName = 'gutenberg';
            const prNumber = 38360;

            if (!ownerName || !repoName || !prNumber) {
                return;
            }

            const {data: contributorData} = await github.graphql(
                `{
                    repository(owner: "${ownerName}", name: "${repoName}") {
                        pullRequest(number: ${prNumber}) {
                            commits(first: 100) {
                                nodes {
                                    commit {
                                        author {
                                            user {
                                                databaseId
                                                login
                                                name
                                                email
                                            }
                                        }
                                    }
                                }
                            }
                            reviews(first: 100) {
                                nodes {
                                    author {
                                        login
                                    }
                                }
                            }
                            comments(first: 100) {
                                nodes {
                                    author {
                                        login
                                    }
                                }
                            }
                        }
                    }
                }`
            );

            console.debug( contributorData );

            coAuthorData.userData = [];
            coAuthorData.committers = new Set();

            for (const commit of contributorData.repository.pullRequest.commits.nodes) {
                coAuthorData.committers.add(commit.commit.author.user.login);
                coAuthorData.userData[commit.commit.author.user.login] = commit.commit.author.user;
            }

            coAuthorData.reviewers = new Set();

            for (const review of contributorData.repository.pullRequest.reviews.nodes) {
                // Only store reviewers that aren't committers.
                if (!coAuthorData.committers.has(review.author.login)) {
                    coAuthorData.reviewers.add(review.author.login);
                }
            }

            coAuthorData.commenters = new Set();

            for (const comment of contributorData.repository.pullRequest.comments.nodes) {
                // Only store commenters that aren't committers or reviewers.
                if (!coAuthorData.committers.has(comment.author.login) && !coAuthorData.reviewers.has(comment.author.login)) {
                    coAuthorData.commenters.add(comment.author.login);
                }
            }

            // We already have user info for committers, we need to grab it for everyone else.
            const {data: userData} = await api.v4(
                '{' +
                    [...coAuthorData.reviewers, ...coAuthorData.commenters].map(user =>
                        escapeForGql(user) + `: user(login: "${user}") {databaseId, login, name, email}`
                    ) +
                '}'
            );

            Object.values(userData).forEach(user => {
                coAuthorData.userData[user.login] = user;
            });

      # Fetches all commit authors for the pull request.
      - name: Fetch pull request commits
        uses: actions/github-script@e3cbab99d3a9b271e1b79fc96d103a4a5534998c # v5.1.0
        continue-on-error: ${{ true }}
        with:
          script: |
            const pr_committers = [];

            const pr_commits = await github.rest.pulls.listCommits({
              owner: 'WordPress',
              repo: 'gutenberg',
              pull_number: 38362,
            });

            pr_commits.data.forEach( function( element, index, array ) {
              // Log both author and committer if they are different.
              let committer = '';
              let author = '';

              if ( null != element.committer ) {
                committer = element.committer.login;
              } else {
                // Is this the best way to format?
                committer = element.commit.committer.name + ' <' + element.commit.committer.email + '>';
              }

              if ( null != element.author ) {
                author = element.author.login;
              } else {
                // Is this the best way to format?
                author = element.commit.author.name + ' <' + element.commit.author.email + '>';
              }

              pr_committers.push( committer );

              if ( author != committer ) {
                pr_comitters.push( author );
              }
            });

            console.debug( pr_committers );

            return JSON.stringify( pr_committers );

      # Fetches all pull request commenters.
      - name: Fetch pull request commenters
        uses: actions/github-script@e3cbab99d3a9b271e1b79fc96d103a4a5534998c # v5.1.0
        continue-on-error: ${{ true }}
        with:
          script: |
            const pr_commenters = [];

            const pr_comments = await github.rest.issues.listComments({
              owner: 'WordPress',
              repo: 'gutenberg',
              issue_number: 38362,
            });

            pr_comments.data.forEach( function( element, index, array ) {
              pr_commenters.push( element.user.login );
            });

            console.debug( pr_commenters );
            console.debug( ${{ toJSON( github.event.pull_request ) }} );

            return JSON.stringify( pr_commenters );

      # Fetches all contributors engaged in pull request reviews.
      - name: Fetch pull request reviewer discussions
        uses: actions/github-script@e3cbab99d3a9b271e1b79fc96d103a4a5534998c # v5.1.0
        continue-on-error: ${{ true }}
        with:
          script: |
            const pr_reviewers = [];

            const pr_review_comments = await github.rest.pulls.listReviewComments({
              owner: 'WordPress',
              repo: 'gutenberg',
              pull_number: 38362,
            });

            pr_review_comments.data.forEach( function( element, index, array ) {
              pr_reviewers.push( element.user.login );
            });
            console.debug( pr_reviewers );

            return JSON.stringify( pr_reviewers );

      # Fetches all issues linked to the pull request.
      - name: Fetch linked issues
        uses: kin/gh-action-get-linked-issues@8ef8d85f1410531f5adadb30609d92cda2c8a650 # v2.0
        id: linked-issues

      - name: Print linked issue numbers
        run: echo ${{ steps.linked-issues.outputs.issues }}
