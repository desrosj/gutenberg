name: TypeScript build memory experiment

# Measures the memory used by `npm run build` under the limits of the standard
# GitHub-hosted runners for private repositories (2 vCPU, 8 GB RAM). Public
# repositories get larger runners, so each strategy runs inside a cgroup that
# caps memory and CPUs to match.

on:
    pull_request:
        paths:
            - '.github/workflows/tsc-memory-experiment.yml'
            - 'tools/build-scripts/**'
    workflow_dispatch:
        inputs:
            memory_max:
                description: 'cgroup MemoryMax (RAM available to the build)'
                default: '7G'
            swap_max:
                description: 'cgroup MemorySwapMax'
                default: '0'

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

permissions: {}

jobs:
    measure:
        name: ${{ matrix.name }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: 'Single process (current)'
                      batch_size: '0'
                      extra_args: ''
                    - name: 'Single process, 1 builder, 1 checker'
                      batch_size: '0'
                      extra_args: '--builders 1 --checkers 1'
                    - name: 'Batches of 1, 1 checker'
                      batch_size: '1'
                      extra_args: '--checkers 1'
                    - name: 'Batches of 5, 1 checker'
                      batch_size: '5'
                      extra_args: '--checkers 1'
                    - name: 'Batches of 15, 1 checker'
                      batch_size: '15'
                      extra_args: '--checkers 1'
                    - name: 'Batches of 5, 2 checkers'
                      batch_size: '5'
                      extra_args: '--checkers 2'
        env:
            # The private runners have 8 GB in total. Leave about 1 GB for the
            # OS and the runner agent.
            MEMORY_MAX: ${{ inputs.memory_max || '7G' }}
            SWAP_MAX: ${{ inputs.swap_max || '0' }}
            NODE_OPTIONS: --max-old-space-size=4096

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
                  persist-credentials: false

            - name: Use desired version of Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Pin npm version for consistency
              run: npm install -g npm@11

            - name: npm ci
              run: npm ci

            - name: Runner resources
              run: |
                  echo "CPUs: $(nproc)"
                  free -m
                  swapon --show || true
                  stat -fc %T /sys/fs/cgroup
                  test -x /usr/bin/time || sudo apt-get install -y --no-install-recommends time

            - name: Create the constrained runner
              run: |
                  # Runs a command inside a transient systemd scope that caps
                  # memory, swap and CPUs, then reports the scope's peak memory
                  # and whether the OOM killer fired.
                  cat > "$RUNNER_TEMP/constrained" <<'EOF'
                  #!/bin/bash
                  exec sudo systemd-run --scope --quiet --collect \
                      -p MemoryMax="$MEMORY_MAX" -p MemorySwapMax="$SWAP_MAX" -p CPUQuota=200% \
                      -p OOMPolicy=continue \
                      --uid="$(id -u)" --gid="$(id -g)" \
                      -- /usr/bin/env PATH="$PATH" HOME="$HOME" CI=true GOMAXPROCS=2 \
                      NODE_OPTIONS="$NODE_OPTIONS" \
                      GUTENBERG_TSC_BATCH_SIZE="${GUTENBERG_TSC_BATCH_SIZE-}" \
                      GUTENBERG_TSC_EXTRA_ARGS="${GUTENBERG_TSC_EXTRA_ARGS-}" \
                      GUTENBERG_TSC_MEASURE=1 \
                      GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
                      LABEL="${LABEL-}" \
                      taskset -c 0,1 bash -c '
                          cgroup="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
                          start=$(date +%s)
                          "$@"
                          status=$?
                          peak=$(( $(cat "$cgroup/memory.peak") / 1048576 ))
                          oom=$(awk "/^oom_kill /{print \$2}" "$cgroup/memory.events")
                          echo "Exit status $status, cgroup peak ${peak} MiB, OOM kills ${oom}, $(( $(date +%s) - start ))s"
                          if [ -n "$LABEL" ]; then
                              echo "| $LABEL | $status | ${peak} MiB | ${oom} | $(( $(date +%s) - start ))s |" >> "$GITHUB_STEP_SUMMARY"
                          fi
                          exit $status
                      ' _ "$@"
                  EOF
                  chmod +x "$RUNNER_TEMP/constrained"

            - name: Check that the limits are enforced
              run: |
                  "$RUNNER_TEMP/constrained" bash -c 'echo "CPUs visible: $(nproc)"; cat "/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)/memory.max"'
                  # Allocating more than MemoryMax must be killed.
                  if "$RUNNER_TEMP/constrained" python3 -c 'b = bytearray( 9 * 1024 ** 3 ); b[ ::4096 ] = b"x" * len( b[ ::4096 ] )'; then
                      echo '::error::The memory limit was not enforced.'
                      exit 1
                  fi

            - name: npm run build (constrained)
              env:
                  GUTENBERG_TSC_BATCH_SIZE: ${{ matrix.batch_size }}
                  GUTENBERG_TSC_EXTRA_ARGS: ${{ matrix.extra_args }}
                  LABEL: ${{ matrix.name }}
              run: |
                  {
                      echo "Limits: MemoryMax=$MEMORY_MAX, MemorySwapMax=$SWAP_MAX, 2 CPUs"
                      echo
                      echo '| Strategy | Exit status | Peak memory (cgroup) | OOM kills | Duration |'
                      echo '|---|---|---|---|---|'
                  } >> "$GITHUB_STEP_SUMMARY"
                  "$RUNNER_TEMP/constrained" npm run build
