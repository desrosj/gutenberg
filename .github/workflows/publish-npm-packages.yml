name: Publish npm packages

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: 'Release type'
                required: true
                type: choice
                default: 'development'
                options:
                    - development
                    - bugfix
                    - wp
            wp_version:
                description: 'WordPress major version (`wp` only)'
                type: string
            wp_publish_mode:
                description: 'How to choose the packages to publish (`wp` only)'
                type: choice
                default: 'changed'
                options:
                    - changed
                    - from-package
            ignore_changes:
                description: 'Extra space-separated globs to ignore when detecting changed packages (`wp` with `changed` only)'
                type: string
            dry_run:
                description: 'List the packages that would be published without publishing them (`wp` only)'
                type: boolean
                default: false

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    release:
        name: Release - ${{ github.event.inputs.release_type }}
        runs-on: 'ubuntu-24.04'
        environment: WordPress packages
        steps:
            - name: Checkout (for CLI)
              if: ${{ github.event.inputs.release_type != 'wp' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: cli
                  ref: trunk
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Checkout (for publishing)
              if: ${{ github.event.inputs.release_type != 'wp' }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: publish
                  # Later, we switch this branch in the script that publishes packages.
                  ref: trunk
                  token: ${{ secrets.GUTENBERG_TOKEN }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Checkout (for publishing WP major version)
              if: ${{ github.event.inputs.release_type == 'wp' && github.event.inputs.wp_version }}
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: publish
                  ref: wp/${{ github.event.inputs.wp_version }}
                  # We need to ensure that Lerna can read the commit created during the previous npm publishing.
                  # Lerna assumes that all packages need publishing if it can't access the necessary information.
                  fetch-depth: 999
                  # A dry run never pushes, so it does not need the release token.
                  token: ${{ github.event.inputs.dry_run == 'true' && github.token || secrets.GUTENBERG_TOKEN }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            # The checkout above always fetches with `--no-tags`. Lerna finds the previous release through its tags,
            # and assumes that every package changed without them. A plain fetch brings in the tags on this history
            # (`fetch-tags: true` would fetch every tag in the repository instead).
            - name: Fetch release tags (for publishing WP major version)
              if: ${{ github.event.inputs.release_type == 'wp' && github.event.inputs.wp_version }}
              run: git -C publish fetch --depth=999 origin "refs/heads/wp/${WP_VERSION}"
              env:
                  WP_VERSION: ${{ github.event.inputs.wp_version }}

            - name: Configure git user name and email (for publishing)
              run: |
                  cd publish
                  git config user.name "Gutenberg Repository Automation"
                  git config user.email gutenberg@wordpress.org

            - name: Setup Node.js
              if: ${{ github.event.inputs.release_type != 'wp' }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: 'cli/.nvmrc'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Setup Node.js (for WP major version)
              if: ${{ github.event.inputs.release_type == 'wp' && github.event.inputs.wp_version }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: 'publish/.nvmrc'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Publish development packages to npm ("next" dist-tag)
              if: ${{ github.event.inputs.release_type == 'development' }}
              run: |
                  cd cli
                  npm ci
                  ./bin/plugin/cli.js npm-next --ci --repository-path ../publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish packages to npm with bug fixes ("latest" dist-tag)
              if: ${{ github.event.inputs.release_type == 'bugfix' }}
              run: |
                  cd cli
                  npm ci
                  ./bin/plugin/cli.js npm-bugfix --ci --repository-path ../publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish packages to npm for WP major version ("wp-${{ github.event.inputs.wp_version || 'X.Y' }}" dist-tag)
              if: ${{ github.event.inputs.release_type == 'wp' && github.event.inputs.wp_version }}
              run: |
                  cd publish
                  npm ci

                  if [ "${PUBLISH_MODE}" = 'from-package' ]; then
                      if [ "${DRY_RUN}" = 'true' ]; then
                          # Lists the same packages `lerna publish from-package` checks: public versions missing from npm.
                          npm exec --no -- lerna ls --json --loglevel=silent |
                              node -e 'for ( const { name, version } of JSON.parse( require( "fs" ).readFileSync( 0, "utf8" ) ) ) console.log( name, version )' |
                              while read -r name version; do
                                  if [ "$( npm view "${name}@${version}" version 2> /dev/null )" != "${version}" ]; then
                                      echo "Would publish ${name}@${version}"
                                  fi
                              done
                          exit 0
                      fi

                      npm exec --no -- lerna publish from-package --dist-tag "wp-${WP_VERSION}" --yes --no-verify-access
                      exit 0
                  fi

                  # Passing --ignore-changes replaces the list in lerna.json, so repeat it before adding the extra globs.
                  ignore=( '**/benchmark/*.js' '**/CHANGELOG.md' '**/{__mocks__,__tests__,test}/**' '**/{storybook,stories}/**' )
                  read -ra extra <<< "${IGNORE_CHANGES}"
                  ignore+=( "${extra[@]}" )

                  if [ "${DRY_RUN}" = 'true' ]; then
                      npm exec --no -- lerna changed --long --ignore-changes "${ignore[@]}"
                      exit 0
                  fi

                  npm exec --no -- lerna publish patch --dist-tag "wp-${WP_VERSION}" --no-private --yes --no-verify-access --ignore-changes "${ignore[@]}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  WP_VERSION: ${{ github.event.inputs.wp_version }}
                  PUBLISH_MODE: ${{ github.event.inputs.wp_publish_mode }}
                  IGNORE_CHANGES: ${{ github.event.inputs.ignore_changes }}
                  DRY_RUN: ${{ github.event.inputs.dry_run }}
