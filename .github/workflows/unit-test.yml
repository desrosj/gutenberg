name: Unit Tests

on:
  pull_request:
  push:
    branches:
    - trunk
    - 'release/[0-9]+.[0-9]'
    - 'wp/[0-9]+.[0-9]'
    - wp/latest
    - wp/next

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
  unit-js:
    name: JavaScript

    runs-on: 'ubuntu-24.04'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install and build
      # It's not necessary to run the full build, since Jest can interpret
      # source files with `babel-jest`. Some packages have their own custom
      # build tasks, however. These must be run.
      run: |
        npm ci
        npx lerna run build

    - name: Running the tests
      run: npm run test-unit -- --ci --maxWorkers=2 --cacheDirectory="$HOME/.jest-cache"

  unit-php:
    name: PHP ${{ matrix.php }}${{ matrix.multisite && ' multisite' || '' }}

    runs-on: 'ubuntu-24.04'

    strategy:
      # Don't let one PHP version's failure cancel the others -- each leg is
      # independently useful signal, especially the first time some of these
      # versions are tested in isolation on this branch.
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4']
        multisite: [false, true]

    env:
      # NOTE: this branch's `@wordpress/env` (v1.6.0) predates the
      # `WP_ENV_PHP_VERSION` mechanism entirely -- it is never read anywhere
      # in `packages/env`'s source, and the `wordpress`/`wordpress:cli`/
      # `tests-wordpress`/`tests-cli` Docker images in
      # `build-docker-compose-config.js` are hardcoded, unversioned image
      # references with no PHP-version templating at all. They always run
      # whatever PHP version Docker Hub's floating `wordpress`/`wordpress:cli`
      # tags currently resolve to, regardless of this matrix.
      #
      # The one piece of this branch's Docker Compose config that IS
      # PHP-version-selectable is the standalone `phpunit` service, whose
      # image is `wordpressdevelop/phpunit:${LOCAL_PHP-latest}` -- a raw
      # docker-compose environment-variable substitution (not a wp-env config
      # option). `npm run test-php`/`test-unit-php-multisite` both execute
      # PHPUnit via `wp-env run phpunit`, which shells out to `docker compose
      # run` with no explicit `env` override, so it inherits this variable
      # from the job environment. Setting it here is what actually pins the
      # PHP version PHPUnit itself runs under for each matrix leg.
      LOCAL_PHP: ${{ matrix.php }}-fpm

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install and build
      run: |
        npm ci
        npm run build

    - name: Install WordPress
      run: |
        echo '{ "config": { "SCRIPT_DEBUG": false, "WP_PHP_BINARY": "php", "WP_TESTS_EMAIL": "admin@example.org", "WP_TESTS_TITLE": "Test Blog" } }' > .wp-env.override.json
        chmod -R 767 ./ # TODO: Possibly integrate in wp-env
        npm run wp-env start

    - name: Running the tests (single site)
      if: ${{ ! matrix.multisite }}
      run: npm run test-php

    - name: Running the tests (multisite)
      if: ${{ matrix.multisite }}
      run: npm run test-unit-php-multisite

  mobile-unit-js:
    name: Mobile

    runs-on: 'ubuntu-24.04'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache node modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Npm install and build
      # It's not necessary to run the full build, since Jest can interpret
      # source files with `babel-jest`. Some packages have their own custom
      # build tasks, however. These must be run.
      run: |
        npm ci
        npx lerna run build

    - name: Running the tests
      run: npm run test-unit:native -- --ci --maxWorkers=2 --cacheDirectory="$HOME/.jest-cache"
